###############################################
# TRINETRA - MediaMTX Camera Gateway
###############################################

logLevel: info
logDestinations: [stdout]

# API (local only)
api: yes
apiAddress: 127.0.0.1:9997

# RTSP server
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

# WebRTC for browser dashboard
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# HLS for browser playback
hls: yes
hlsAddress: :8888
hlsAllowOrigins: ['*']

# Disable unused protocols
rtmp: no
srt: no

paths:
  trinetra_cam:
    source: rtsp://172.24.54.227:554/live/ch00_1
    rtspTransport: tcp
    sourceOnDemand: yes
    sourceOnDemandStartTimeout: 15s
    sourceOnDemandCloseAfter: 30s